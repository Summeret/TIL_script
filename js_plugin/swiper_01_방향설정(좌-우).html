<!DOCTYPE html>
<html lang="ko">
<head>
    <title>swiper-direction0</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <!--플러그인 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--플러그인 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <style>
        * {margin:0; padding:0; line-height:1.0; box-sizing:border-box;}
        .swiper {width:1240px; height:350px;}
        .swiper .swiper-wrapper {}
        .swiper .swiper-wrapper .swiper-slide {}
        .swiper .swiper-wrapper .swiper-slide img {width:100%;}
        .swiper .swiper-wrapper .slide1 {}
        .swiper .swiper-wrapper .slide2 {}
        .swiper .swiper-wrapper .slide3 {}
        .swiper .swiper-wrapper .slide4 {}
    </style>
</head>
<body>
    <div class="swiper best">
        <div class="swiper-wrapper">
            <div class="swiper-slide slide1"><img src="./images/bnr1.jpg"></div>
            <div class="swiper-slide slide2"><img src="./images/bnr2.jpg"></div>
            <div class="swiper-slide slide3"><img src="./images/bnr3.jpg"></div>
            <div class="swiper-slide slide4"><img src="./images/bnr4.jpg"></div>
        </div>
    </div>
    <script>

        //기본 : 마우스 드래그로만 움직이는 기본 슬라이드
        //const bestSwiper = new Swiper('.best');
        
        //활용 newswiper('대상,{옵션:값, 옵션:값, 옵션:값, }')
        const bestSwiper = new Swiper('.best',{
            //옵션:값,
            //자동
            autoplay:{delay:1000},
            //반복 -> 마지막 이미지에서 첫번째 이미지로 자연스럽게 넘어감
            loop:true, //문자열이 아니기때문에 '' 묶지 않는다.
            direction:'vertical', //수직방향,  horizontal 수평방향
        });
    </script>
</body>
</html>
