<!DOCTYPE html>
<html lang="ko">
<head>
    <title>swiper-direction1</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <!--플러그인 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--플러그인 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <style>
        * {margin:0; padding:0; line-height:1.0; box-sizing:border-box;}
        .swiper {width:1000px; height:40px; background:#ddd;}
        .swiper .swiper-wrapper {}
        .swiper .swiper-wrapper .swiper-slide {background-color:#ddd;}
        .swiper .swiper-wrapper .swiper-slide .slide1 {}
        .swiper .swiper-wrapper .swiper-slide .slide2 {}
        .swiper .swiper-wrapper .swiper-slide .slide3 {}
        .swiper .swiper-wrapper .swiper-slide .slide4 {}
    </style>
</head>
<body>
    <div class="swiper" id="news">
        <div class="swiper-wrapper">
            <div class="swiper-slide slide1"><a href="#">“이렇게라도 만나서 반가워”…우리 기술로 되살린 ‘구운몽도’ 먼 타국 가기 전 공개</a></div>
            <div class="swiper-slide slide2"><a href="#">당직제 바꿨더니…응급실서 수술 들어가는 시간 70분 단축</a></div>
            <div class="swiper-slide slide3"><a href="#">현대차, 獨 뉘르부르크링 24시 10년 연속 완주</a></div>
            <div class="swiper-slide slide4"><a href="#">놀유니버스, 여름 맞춤 놀거리 혜택 강화…최대 78% 할인</a></div>
        </div>
    </div>
    <script>
        const newsSwiper = new Swiper('#news',{
            effect:'fade',
            autoplay:{delay:1000},
            loop:true,
        });
    </script>
</body>
</html>
