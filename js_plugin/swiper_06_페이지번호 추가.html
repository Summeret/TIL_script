<!DOCTYPE html>
<html lang="ko">
<head>
    <title>swiper-pagenation1</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <!--플러그인 필수 css cdn 연결-->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <!--플러그인 필수 JS cdn 연결-->
    <script src="https://unpkg.com/swiper/swiper-bundle.js"></script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <style>
        * {margin:0; padding:0; line-height:1.0; box-sizing:border-box;}
        .new {
            width:1000px; height:400px;
        }
        .new .swiper-wrapper {}
        .new .swiper-wrapper .swiper-slide {
            background:url(./images/bnr2.jpg) center / cover;
        }
        .new .swiper-wrapper .slide1 {}
        .new .swiper-wrapper .slide2 {}
        .new .swiper-wrapper .slide3 {}
        .new .swiper-wrapper .slide4 {}
        main {
            background-color:yellow; padding:50px;
            position:relative;
        }
        main .swiper-pagination {}
        main .swiper-pagination .swiper-pagination-bullet {background-color:#000;}
    </style>
</head>
<body>
    <main>
        <div class="swiper new">
            <div class="swiper-wrapper"> <!-- 개별 슬라이드만 존재 (추가 태그는 바깥쪽에 작성) -->
                <div class="swiper-slide slide1"></div>
                <div class="swiper-slide slide2"></div>
                <div class="swiper-slide slide3"></div>
                <div class="swiper-slide slide4"></div>
            </div>
            <!-- (선택) 슬라이드 페이지 번호 표시할때 작성 -->
            <!-- 페이지번호를 슬라이드 안에서 보고 싶을 땐 swiper 부모의 자식으로 배치 -->
            <!-- <div class="swiper-pagination"></div> -->
            <!-- 페이지번호를 슬라이드 밖에서 보고 싶을 땐 swiper 형제로 배치 -->
        </div>
        <div class="swiper-pagination"></div> <!-- swiper 형제 위치 (한번 더 묶고 았는 태그 안에서 슬라이드밖으로 빼기)-->
    </main>
    <script>
        const newSlide = new Swiper('.new',{
            pagination:{
                el:'.new+.swiper-pagination',  //대상 설정 우선, element 약자
                type:'bullets', //슬라이드 개수에 따라 자동으로 갯수가 적용된다.
            },
        });
    </script>
</body>
</html>
